<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo — Simple &amp; Beautiful</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #1e2230;
    --border: #262b3b;
    --text: #e8eaf2;
    --text-dim: #8b91a7;
    --accent: #6c7bff;
    --accent-soft: rgba(108, 123, 255, 0.14);
    --danger: #ff5c6c;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(108, 123, 255, 0.13), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(96, 214, 196, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  header { margin-bottom: 28px; }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .count-pill {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 3px 11px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
  }

  /* ---- input row ---- */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .input-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row input::placeholder { color: var(--text-dim); }

  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s, filter 0.2s;
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add:active { transform: scale(0.97); }

  /* ---- filters ---- */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filters button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }

  .filters button:hover { color: var(--text); border-color: var(--text-dim); }

  .filters button.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---- list ---- */
  ul.todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li.todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    animation: slide-in 0.22s ease;
    transition: border-color 0.2s;
  }

  li.todo-item:hover { border-color: #333a4f; }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* custom checkbox */
  .check {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border: 2px solid var(--text-dim);
    border-radius: 7px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.18s;
  }

  .check:hover { border-color: var(--accent); }

  li.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check svg {
    width: 13px;
    height: 13px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.18s;
  }

  li.done .check svg { opacity: 1; transform: scale(1); }

  .todo-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    transition: color 0.2s;
  }

  li.done .todo-text {
    color: var(--text-dim);
    text-decoration: line-through;
  }

  .btn-delete {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: all 0.15s;
  }

  li.todo-item:hover .btn-delete,
  .btn-delete:focus-visible { opacity: 1; }

  .btn-delete:hover {
    background: rgba(255, 92, 108, 0.14);
    color: var(--danger);
  }

  .btn-delete svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
  }

  /* ---- empty state ---- */
  .empty {
    text-align: center;
    padding: 52px 16px;
    color: var(--text-dim);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty .emoji { font-size: 32px; display: block; margin-bottom: 10px; }

  /* ---- footer / progress ---- */
  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .btn-clear {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: all 0.15s;
  }
  .btn-clear:hover { color: var(--danger); background: rgba(255, 92, 108, 0.1); }
  .btn-clear:disabled { opacity: 0.35; cursor: default; background: transparent; color: var(--text-dim); }

  .progress-track {
    width: 100%;
    height: 4px;
    background: var(--surface-2);
    border-radius: 999px;
    margin-top: 16px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface-2: #eceef5;
      --border: #dfe2ec;
      --text: #1b1e28;
      --text-dim: #6b7186;
      --shadow: 0 8px 30px rgba(30, 40, 90, 0.08);
    }
    body {
      background:
        radial-gradient(1000px 500px at 80% -10%, rgba(108, 123, 255, 0.10), transparent 60%),
        var(--bg);
    }
    li.todo-item:hover { border-color: #c8cdd9; }
  }

  @media (max-width: 480px) {
    body { padding: 24px 12px 60px; }
    h1 { font-size: 24px; }
    .btn-delete { opacity: 0.6; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Todo <span class="count-pill" id="count-pill">0</span></h1>
      <p class="subtitle">Stay on top of your day.</p>
    </header>

    <div class="input-row">
      <input type="text" id="new-todo" placeholder="What needs to be done?" maxlength="200" autocomplete="off" />
      <button class="btn-add" id="add-btn">Add</button>
    </div>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="done">Done</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="footer-bar">
      <span id="summary">0 tasks</span>
      <button class="btn-clear" id="clear-done">Clear completed</button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todos.v1";
  var todos = load();
  var filter = "all";

  var listEl = document.getElementById("todo-list");
  var inputEl = document.getElementById("new-todo");
  var addBtn = document.getElementById("add-btn");
  var filtersEl = document.getElementById("filters");
  var summaryEl = document.getElementById("summary");
  var countPill = document.getElementById("count-pill");
  var clearDone = document.getElementById("clear-done");
  var progressFill = document.getElementById("progress-fill");

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  /* ---------- mutations ---------- */
  function addTodo(text) {
    text = text.trim();
    if (!text) return;
    todos.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), text: text, done: false, created: Date.now() });
    save();
    render();
  }

  function toggleTodo(id) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id === id) { todos[i].done = !todos[i].done; break; }
    }
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.done; });
    save();
    render();
  }

  /* ---------- rendering ---------- */
  function visibleTodos() {
    if (filter === "pending") return todos.filter(function (t) { return !t.done; });
    if (filter === "done") return todos.filter(function (t) { return t.done; });
    return todos;
  }

  function render() {
    var items = visibleTodos();

    // list
    listEl.innerHTML = "";
    if (items.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      var msg = filter === "done"
        ? "Nothing completed yet."
        : filter === "pending"
          ? "All caught up! Nothing pending. 🎉"
          : "No tasks yet. Add one above.";
      empty.innerHTML = '<span class="emoji">' + (filter === "pending" ? "🎉" : "📝") + "</span>" + msg;
      listEl.appendChild(empty);
    } else {
      items.forEach(function (todo) {
        var li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");
        li.dataset.id = todo.id;

        var check = document.createElement("div");
        check.className = "check";
        check.setAttribute("role", "button");
        check.setAttribute("aria-label", todo.done ? "Mark as not done" : "Mark as done");
        check.tabIndex = 0;
        check.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        check.addEventListener("click", function () { toggleTodo(todo.id); });
        check.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTodo(todo.id); }
        });

        var span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;
        span.addEventListener("doubleclick", function () {
          // quick inline edit via prompt (kept dependency-free)
          var next = prompt("Edit task:", todo.text);
          if (next !== null && next.trim()) {
            for (var i = 0; i < todos.length; i++) {
              if (todos[i].id === todo.id) { todos[i].text = next.trim(); break; }
            }
            save();
            render();
          }
        });

        var del = document.createElement("button");
        del.className = "btn-delete";
        del.setAttribute("aria-label", "Delete task");
        del.title = "Delete";
        del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        del.addEventListener("click", function () { deleteTodo(todo.id); });

        li.appendChild(check);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    // summary + progress + pill
    var total = todos.length;
    var doneCount = todos.filter(function (t) { return t.done; }).length;
    summaryEl.textContent = total + " task" + (total === 1 ? "" : "s") + (total ? " · " + (total - doneCount) + " left" : "");
    countPill.textContent = total;
    clearDone.disabled = doneCount === 0;
    progressFill.style.width = total ? Math.round((doneCount / total) * 100) + "%" : "0%";
  }

  /* ---------- events ---------- */
  addBtn.addEventListener("click", function () {
    addTodo(inputEl.value);
    inputEl.value = "";
    inputEl.focus();
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      addTodo(inputEl.value);
      inputEl.value = "";
    }
  });

  filtersEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    filter = btn.dataset.filter;
    filtersEl.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  clearDone.addEventListener("click", clearCompleted);

  // storage events keep multiple tabs in sync
  window.addEventListener("storage", function (e) {
    if (e.key === STORAGE_KEY) {
      todos = load();
      render();
    }
  });

  render();
  inputEl.focus();
})();
</script>
</body>
</html>
